apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app-ingress
  namespace: staging
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx          
  rules:
    - host: wbs.example.com     
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wbssvc
                port:
                  number: 8080
